spring.application.name=typing-game-backend

# In-memory H2 database for local development and tests.
# Override these with environment variables for production (SPRING_DATASOURCE_URL, etc.).
spring.datasource.url=jdbc:h2:mem:typing_game;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
